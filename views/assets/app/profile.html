<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil — TrainiFy</title>

    <link rel="stylesheet" href="../../assets/_common/styles/reset.css">
    <link rel="stylesheet" href="../../assets/_common/styles/global.css">
    <link rel="stylesheet" href="../../assets/app/styles/app-layout.css">
    <link rel="stylesheet" href="../../assets/app/styles/profile.css">
</head>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-shell">

        <aside class="sidebar" id="appSidebar">

            <div class="sidebar-logo">
                <img
                    src="../../assets/_common/images/logo.svg"
                    alt="TrainiFy"
                >
            </div>

            <nav class="sidebar-nav">

                <span class="nav-section-label">
                    Principal
                </span>

                <a
                    class="nav-item"
                    href="dashboard.html"
                    data-href="dashboard"
                >
                    <span class="nav-icon">◼</span>
                    Dashboard
                </a>

                <a
                    class="nav-item"
                    href="students.html"
                    data-href="students"
                >
                    <span class="nav-icon">👥</span>
                    Alunos
                </a>

                <span class="nav-section-label">
                    Conta
                </span>

                <a
                    class="nav-item active"
                    href="profile.html"
                    data-href="profile"
                >
                    <span class="nav-icon">👤</span>
                    Meu Perfil
                </a>

                <a
                    class="nav-item"
                    href="#"
                    data-action="logout"
                >
                    <span class="nav-icon">↩</span>
                    Sair
                </a>

            </nav>

            <div class="sidebar-footer">

                <div class="user-widget">

                    <div
                        class="user-avatar"
                        id="sidebarUserInitials"
                    >
                        PT
                    </div>

                    <div class="user-info">

                        <div
                            class="user-name"
                            id="sidebarUserName"
                        >
                            Personal Trainer
                        </div>

                        <div class="user-role">
                            Treinador
                        </div>

                    </div>

                </div>

            </div>

        </aside>

        <header class="topbar">

            <div class="profile-topbar-left">

                <button
                    class="icon-btn show-mobile"
                    id="sidebarOpenBtn"
                    type="button"
                >
                    ☰
                </button>

                <h1 class="topbar-title">
                    Meu Perfil
                </h1>

            </div>

            <div class="topbar-actions">

                <span
                    class="profile-topbar-name"
                    id="topbarUserName"
                ></span>

            </div>

        </header>

        <main class="main-content">

            <div class="page-header">

                <div>

                    <h2 class="page-title">
                        Meu Perfil
                    </h2>

                    <p class="page-subtitle">
                        Gerencie seus dados de personal trainer
                    </p>

                </div>

            </div>

            <div class="profile-page-grid">

                <!-- CARD LATERAL -->

                <aside class="profile-sidebar-card">

                    <div
                        class="profile-avatar-xl"
                        id="profileAvatarInitials"
                    >
                        PT
                    </div>

                    <div
                        class="profile-sidebar-name"
                        id="profileSidebarName"
                    >
                        —
                    </div>

                    <div class="profile-sidebar-role">
                        Personal Trainer
                    </div>

                    <div class="profile-sidebar-stats">

                        <div class="profile-mini-stat">

                            <div
                                class="num"
                                id="statStudents"
                            >
                                0
                            </div>

                            <div class="lbl">
                                Alunos
                            </div>

                        </div>

                        <div class="profile-mini-stat">

                            <div
                                class="num"
                                id="statWorkouts"
                            >
                                0
                            </div>

                            <div class="lbl">
                                Treinos
                            </div>

                        </div>

                    </div>

                </aside>

                <!-- CONTEÚDO -->

                <section class="profile-main">

                    <div class="profile-section-card">

                        <div class="profile-section-header">

                            <h3>
                                Informações Pessoais
                            </h3>

                        </div>

                        <div class="profile-form">

                            <form id="profileForm">

                                <div class="form-row">

                                    <div class="form-group">

                                        <label for="profileName">
                                            Nome Completo
                                        </label>

                                        <input
                                            class="form-control"
                                            id="profileName"
                                            name="profileName"
                                            type="text"
                                            placeholder="Seu nome completo"
                                            required
                                        >

                                    </div>

                                    <div class="form-group">

                                        <label for="profileEmail">
                                            Email
                                        </label>

                                        <input
                                            class="form-control"
                                            id="profileEmail"
                                            name="profileEmail"
                                            type="email"
                                            placeholder="seu@email.com"
                                            required
                                        >

                                    </div>

                                    <div class="form-group">

                                        <label for="profilePhone">
                                            Telefone
                                        </label>

                                        <input
                                            class="form-control"
                                            id="profilePhone"
                                            name="profilePhone"
                                            type="text"
                                            placeholder="(51) 99999-0000"
                                        >

                                    </div>

                                    <div class="form-group">

                                        <label for="profileCref">
                                            CREF
                                        </label>

                                        <input
                                            class="form-control"
                                            id="profileCref"
                                            name="profileCref"
                                            type="text"
                                            placeholder="000000-G/RS"
                                        >

                                    </div>

                                    <div class="form-group">

                                        <label for="profileCity">
                                            Cidade
                                        </label>

                                        <input
                                            class="form-control"
                                            id="profileCity"
                                            name="profileCity"
                                            type="text"
                                            placeholder="Porto Alegre, RS"
                                        >

                                    </div>

                                    <div class="form-group">

                                        <label for="profileSpecialty">
                                            Especialidade
                                        </label>

                                        <input
                                            class="form-control"
                                            id="profileSpecialty"
                                            name="profileSpecialty"
                                            type="text"
                                            placeholder="Hipertrofia, Funcional..."
                                        >

                                    </div>

                                    <div
                                        class="form-group profile-full-width"
                                    >

                                        <label for="profileBio">
                                            Bio
                                        </label>

                                        <textarea
                                            class="form-control"
                                            id="profileBio"
                                            name="profileBio"
                                            placeholder="Conte um pouco sobre você e sua metodologia de trabalho..."
                                        ></textarea>

                                    </div>

                                </div>

                                <div class="profile-form-actions">

                                    <button
                                        type="button"
                                        class="btn btn-ghost"
                                        id="profileCancelBtn"
                                    >
                                        Cancelar
                                    </button>

                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                        id="profileSaveBtn"
                                    >
                                        Salvar Alterações
                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                    <!-- EXCLUSÃO -->

                    <div
                        class="profile-section-card danger-card"
                    >

                        <div class="profile-section-header danger-header">

                            <h3>
                                Zona de Perigo
                            </h3>

                        </div>

                        <div class="profile-form">

                            <p class="danger-description">
                                A exclusão da conta é permanente e remove
                                seu acesso ao TrainiFy.
                            </p>

                            <button
                                class="btn btn-danger"
                                type="button"
                                id="deleteAccountBtn"
                            >
                                Excluir minha conta
                            </button>

                        </div>

                    </div>

                </section>

            </div>

        </main>

    </div>

    <script
        src="../../assets/app/scripts/app-layout.js"
    ></script>

    <script
        type="module"
        src="../../assets/app/scripts/profile.js"
    ></script>

</body>

</html>
